name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-

      - name: Compile Java interfaces
        run: |
          for i in 1 2 3; do
            clojure -T:build compile-java && exit 0
            echo "compile-java attempt $i failed, retrying..." >&2
            sleep 3
          done
          exit 1

      - name: Run tests
        run: clojure -M:test

      - name: Deploy to Clojars
        run: clojure -T:build deploy :version "\"${GITHUB_REF_NAME#v}\""
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
