name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-

      # tools.deps parallel classpath resolution occasionally races on
      # HashMap treeify under Java 21. Retry a few times on transient failures.
      - name: Compile Java interfaces
        run: |
          for i in 1 2 3; do
            clojure -T:build compile-java && exit 0
            echo "compile-java attempt $i failed, retrying..." >&2
            sleep 3
          done
          exit 1

      - name: Run tests
        run: clojure -M:test
